[project]
name = "data-analyst-forecasting"
version = "0.1.0"
description = "Fashion sales forecasting using NHITS neural network model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "neuralforecast>=1.6.0",
    "matplotlib>=3.7.0",
    "scipy>=1.15.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "data", "visualization"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ipython>=8.0.0",
]

